<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KILN ad</title>
<!-- 1080×1920 UI-animation ad: phone mockup of the site, kinetic type cards and full-bleed
     clay close-ups. Driven frame by frame by promo/render.mjs --page ad.html -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Martian+Mono:wght@300;400;500&display=swap">
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
<style>
  :root {
    --plaster: #e2e4df; --ink: #191c1a; --ink-2: #5a605b; --rule: rgba(25,28,26,.14);
    --cobalt: #2a43c0; --night: #0b0b0a;
    --f-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --f-mono: "Martian Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { background: var(--plaster); color: var(--ink); font-family: var(--f-ui); -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; }
  #bg { background: var(--plaster); }
  #glow { opacity: 0; background: radial-gradient(75% 42% at 50% 50%, rgba(255,118,40,.62), rgba(190,50,10,.2) 55%, transparent 80%); }
  #c { position: absolute; left: 0; top: 0; }

  /* phone: back (bezel + screen) and front (UI) share one transform; the canvas sits between */
  .phone { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; }
  #phoneBack .body {
    position: absolute; inset: -14px; border-radius: 70px; background: #121212;
    box-shadow: 0 60px 120px rgba(0,0,0,.28), 0 18px 40px rgba(0,0,0,.18), inset 0 0 0 2px #2a2a2a;
  }
  #phoneBack .screen { position: absolute; inset: 0; border-radius: 56px; background: var(--plaster); overflow: hidden; }
  #phoneFront { pointer-events: none; }
  #phoneFront .clip { position: absolute; inset: 0; border-radius: 56px; overflow: hidden; }
  .island { position: absolute; left: 50%; top: 12px; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; }
  .p-top { position: absolute; left: 22px; right: 22px; top: 58px; display: flex; justify-content: space-between; align-items: center; }
  .p-mark { font: 500 14px/1 var(--f-mono); letter-spacing: .32em; }
  .p-btn { border: 1px solid var(--rule); height: 30px; padding: 0 12px; display: flex; align-items: center; font-size: 12.5px; font-weight: 500; }
  .p-type { position: absolute; left: 22px; right: 22px; top: 100px; text-align: center; }
  .p-input { font: 500 25px/1.2 var(--f-ui); border-bottom: 1px solid var(--cobalt); padding: 4px 0 7px; min-height: 38px; }
  .p-caret { display: inline-block; width: 2px; height: 26px; background: var(--cobalt); vertical-align: -4px; margin-left: 2px; }
  .p-hint { margin-top: 6px; font: 400 9.5px/1 var(--f-mono); color: var(--ink-2); letter-spacing: .04em; }
  .p-sheet { position: absolute; left: 0; right: 0; top: 520px; bottom: 56px; padding: 14px 18px; border-top: 1px solid var(--rule);
    background: rgba(226,228,223,.92); display: flex; flex-direction: column; gap: 10px; }
  .p-eyebrow { font: 400 9.5px/1 var(--f-mono); letter-spacing: .14em; color: var(--ink-2); text-transform: uppercase; }
  .p-title { font: 600 17px/1.15 var(--f-ui); letter-spacing: -.01em; margin-top: -2px; }
  .p-label { font: 400 9px/1 var(--f-mono); letter-spacing: .12em; color: var(--ink-2); text-transform: uppercase; }
  .p-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .p-chip { border: 1px solid var(--rule); padding: 6px 10px; display: flex; gap: 7px; align-items: center; font-size: 12.5px; }
  .p-chip.on { color: var(--cobalt); border-color: var(--cobalt); }
  .p-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
  .p-glazes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .p-glaze { display: flex; flex-direction: column; gap: 5px; font-size: 10.5px; }
  .p-tile { aspect-ratio: 3/4; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); position: relative; overflow: hidden; }
  .p-tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.38) 0 18%, transparent 30%); }
  .p-glaze.on .p-tile { outline: 1.5px solid var(--cobalt); outline-offset: 2px; }
  .p-glaze.on { color: var(--cobalt); }
  .p-solid { background: var(--ink); color: var(--plaster); height: 36px; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 13.5px; }
  .p-solid.press { background: var(--cobalt); }
  .p-rail { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; border-top: 1px solid var(--rule); display: flex; align-items: center;
    padding: 0 16px 6px; gap: 10px; background: rgba(226,228,223,.92); }
  .p-steps { display: flex; flex: 1; gap: 0; height: 100%; }
  .p-steps span { flex: 1; display: flex; align-items: center; font: 400 10.5px var(--f-mono); color: var(--ink-2); position: relative; }
  .p-steps span.past { color: var(--ink); } .p-steps span.past::before { content: ""; position: absolute; top: -1px; left: 0; right: 5px; height: 2px; background: var(--ink); }
  .p-steps span.cur { color: var(--cobalt); } .p-steps span.cur::before { content: ""; position: absolute; top: -1px; left: 0; right: 5px; height: 2px; background: var(--cobalt); }
  .p-next { background: var(--ink); color: var(--plaster); font-size: 12px; font-weight: 500; height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 6px; }
  .home { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #111; }

  /* touch indicator */
  #touch { position: absolute; width: 0; height: 0; opacity: 0; }
  #touch .dot { position: absolute; width: 74px; height: 74px; left: -37px; top: -37px; border-radius: 50%;
    background: rgba(255,255,255,.55); box-shadow: 0 0 0 2px rgba(25,28,26,.35), 0 8px 24px rgba(0,0,0,.18); backdrop-filter: blur(2px); }
  #touch .ripple { position: absolute; width: 74px; height: 74px; left: -37px; top: -37px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9); opacity: 0; }

  /* kinetic type */
  .card { position: absolute; left: 90px; right: 90px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .words { font: 800 176px/0.94 var(--f-ui); letter-spacing: -0.05em; }
  .words .w { display: inline-block; margin-right: 0.18em; will-change: transform; }
  .big-top { position: absolute; left: 84px; right: 84px; top: 210px; font: 800 150px/0.94 var(--f-ui); letter-spacing: -0.05em; }
  .counter { position: absolute; left: 84px; right: 84px; top: 1380px; font: 300 210px/1 var(--f-mono); letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
  .counter small { font-size: 46px; letter-spacing: 0; margin-left: 12px; opacity: .6; }
  .pill { position: absolute; left: 50%; top: 1500px; transform: translateX(-50%); padding: 22px 38px; border-radius: 60px;
    font: 600 44px/1 var(--f-ui); letter-spacing: -0.01em; background: var(--ink); color: var(--plaster); white-space: nowrap; }
  .caption { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font: 600 64px/1.05 var(--f-ui); letter-spacing: -0.035em; }

  .end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 470px; gap: 26px; text-align: center; }
  .end .mark { font: 500 200px/1 var(--f-mono); letter-spacing: .2em; margin-right: -.2em; }
  .end .tag { font: 700 76px/1 var(--f-ui); letter-spacing: -0.04em; }
  .end .cta { margin-top: 20px; font: 400 28px/1 var(--f-mono); letter-spacing: .12em; color: var(--ink-2); text-transform: uppercase; }
</style>
</head>
<body>
<div class="layer" id="bg"></div>
<div class="layer" id="glow"></div>

<div class="phone" id="phoneBack"><div class="body"></div><div class="screen"></div></div>
<canvas id="c"></canvas>
<div class="phone" id="phoneFront">
  <div class="clip">
    <div class="island"></div>
    <div class="p-top"><span class="p-mark">KILN</span><span class="p-btn">Save image</span></div>
    <div class="p-type" id="pType"><div class="p-input" id="pInput"></div><div class="p-hint">Up to 12 letters.</div></div>
    <div class="p-sheet" id="sheetWedge">
      <div class="p-eyebrow">01 — Wedge</div>
      <div class="p-title">Pick a clay and a mould, then type.</div>
      <div class="p-label">Clay body</div>
      <div class="p-chips">
        <span class="p-chip"><i class="p-dot" style="background:#c08a6c"></i>Terracotta</span>
        <span class="p-chip on"><i class="p-dot" style="background:#c7c0b3"></i>Speckled stoneware</span>
        <span class="p-chip"><i class="p-dot" style="background:#e4e1d9"></i>Porcelain</span>
      </div>
      <div class="p-label">Mould</div>
      <div class="p-chips">
        <span class="p-chip on"><b style="font-family:'Bagel Fat One'">a</b>Puff</span>
        <span class="p-chip">Block</span><span class="p-chip">Slab</span><span class="p-chip">Coil</span>
      </div>
    </div>
    <div class="p-sheet" id="sheetGlaze">
      <div class="p-eyebrow">05 — Glaze</div>
      <div class="p-title">Choose a glaze and dip.</div>
      <div class="p-glazes" id="pGlazes"></div>
      <div class="p-solid" id="pDip">Dip</div>
    </div>
    <div class="p-rail"><div class="p-steps" id="pSteps"></div><div class="p-next" id="pNext">Start shaping →</div></div>
    <div class="home"></div>
  </div>
</div>

<div class="layer" id="text"></div>
<div id="touch"><div class="ripple"></div><div class="dot"></div></div>
<script type="module" src="ad.js"></script>
</body>
</html>
